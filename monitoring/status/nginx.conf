server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 読み取り用の2つだけを Prometheus に中継する（設定の変更や削除はできない）
    location = /api/v1/query       { proxy_pass http://prometheus:9090; }
    location = /api/v1/query_range { proxy_pass http://prometheus:9090; }
    location /api/ { return 403; }

    # 試験結果は書き換えたらすぐ反映
    location = /tests.json { add_header Cache-Control no-store; }
}
